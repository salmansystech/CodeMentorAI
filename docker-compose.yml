version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codementor_mysql
    environment:
      MYSQL_DATABASE: codementor_ai
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: codementor
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - codementor

  redis:
    image: redis:7-alpine
    container_name: codementor_redis
    ports:
      - "6379:6379"
    networks:
      - codementor

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codementor_api
    environment:
      APP_NAME: CodeMentorAI
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: codementor_ai
      DB_USERNAME: codementor
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - codementor
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codementor_ui
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
    networks:
      - codementor
    command: npm run dev

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: codementor_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: codementor
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - codementor

networks:
  codementor:
    driver: bridge

volumes:
  mysql_data:
